<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نجوم الإنجاز - تأكيد إنجاز المهام</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --pink: #ff4fa3;
      --purple: #7b42f6;
      --cyan: #00c2ff;
      --card: #ffffff;
      --text: #1f1b2e;
      --muted: #6b6480;
      --done-bg: #eefcf5;
      --done-border: #22c55e;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #fff0f7 0%, #f4eeff 50%, #ebfbff 100%);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan));
      color: #fff;
      padding: 1.25rem 1rem;
      text-align: center;
      box-shadow: 0 6px 20px rgba(123, 66, 246, 0.18);
    }

    header h1 {
      margin: 0 0 0.35rem;
      font-size: 1.6rem;
    }

    header p {
      margin: 0;
      font-size: 0.95rem;
      opacity: 0.95;
    }

    .container {
      max-width: 820px;
      margin: 1.5rem auto;
      padding: 0 1rem 2.5rem;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 1.15rem;
      box-shadow: 0 8px 24px rgba(31, 27, 46, 0.06);
      border: 1px solid rgba(123, 66, 246, 0.12);
      margin-bottom: 1.1rem;
    }

    .task-banner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
    }

    .task-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--purple);
    }

    .summary-pill {
      background: #f4eeff;
      color: var(--purple);
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .add-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.75rem;
    }

    input {
      flex: 1;
      min-width: 180px;
      border-radius: 12px;
      padding: 0.68rem 0.85rem;
      font-size: 0.92rem;
      border: 1px solid #dfd7f2;
      background: #fff;
      color: var(--text);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      padding: 0.68rem 0.95rem;
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
    }

    .student-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-radius: 14px;
      background: #faf7ff;
      border: 1px solid #ece3ff;
      margin-bottom: 0.65rem;
      transition: all 0.2s ease;
    }

    .student-row.done {
      background: var(--done-bg);
      border-color: var(--done-border);
    }

    .student-name {
      font-weight: 700;
      font-size: 1rem;
    }

    .student-status {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .student-row.done .student-status {
      color: #15803d;
      font-weight: 600;
    }

    .star-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem;
      background: #ece6fa;
      color: #9b92b5;
      padding: 0;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .star-btn:active {
      transform: scale(0.92);
    }

    .star-btn.active {
      background: linear-gradient(135deg, var(--pink), var(--purple), var(--cyan));
      color: #fff;
      box-shadow: 0 4px 14px rgba(255, 79, 163, 0.35);
    }

    .note {
      font-size: 0.84rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>نجوم الإنجاز</h1>
    <p>اضغط على النجمة بجانب اسمك لتأكيد إنجاز المطلوب بدل كتابة «تم» في الشات</p>
  </header>

  <main class="container">
    <section class="card">
      <div class="task-banner">
        <div>
          <div style="font-size: 0.82rem; color: var(--muted);">المهمة الحالية</div>
          <div class="task-title" id="currentTaskText">إنجاز المهمة المطلوبة</div>
        </div>
        <div class="summary-pill" id="doneSummary">0 من 0 أنجزوا</div>
      </div>

      <div class="add-row">
        <input type="text" id="taskEditInput" placeholder="تغيير عنوان المهمة (للمعلم)..." />
        <button onclick="updateTaskTitle()">تحديث المهمة</button>
      </div>

      <div class="add-row">
        <input type="text" id="newStudentInput" placeholder="إضافة اسم طالب جديد للقائمة..." />
        <button onclick="addStudent()">إضافة اسم</button>
      </div>

      <div class="note" id="modeNote">
        يعمل الآن في الوضع التجريبي — وعند ربط Supabase سيتم حفظ ضغطات النجوم لجميع الطلاب مباشرة.
      </div>
    </section>

    <section class="card">
      <div id="studentsList"></div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://utxrwnnnfitrwinqjylz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7o15t8LcObTkkeVy7NmNwg_ZYumqdWj";

    const hasSupabase = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);
    const sb = hasSupabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let currentTask = "إنجاز المهمة المطلوبة";

    let students = [
      { id: "1", student_name: "أحمد", completed: false },
      { id: "2", student_name: "سارة", completed: false },
      { id: "3", student_name: "خالد", completed: false },
      { id: "4", student_name: "نورة", completed: false }
    ];

    function updateTaskTitle() {
      const val = document.getElementById("taskEditInput").value.trim();
      if (!val) return;
      currentTask = val;
      document.getElementById("currentTaskText").textContent = currentTask;
      document.getElementById("taskEditInput").value = "";
    }

    function renderStudents() {
      const list = document.getElementById("studentsList");
      const summary = document.getElementById("doneSummary");
      list.innerHTML = "";

      let doneCount = 0;

      students.forEach((st) => {
        if (st.completed) doneCount += 1;

        const row = document.createElement("div");
        row.className = `student-row ${st.completed ? "done" : ""}`;

        const info = document.createElement("div");
        info.innerHTML = `
          <div class="student-name">${st.student_name}</div>
          <div class="student-status">${st.completed ? "تم الإنجاز ⭐" : "بانتظار التأكيد"}</div>
        `;

        const btn = document.createElement("button");
        btn.className = `star-btn ${st.completed ? "active" : ""}`;
        btn.title = st.completed ? "إلغاء النجمة" : "تأكيد الإنجاز بالنجمة";
        btn.textContent = "★";
        btn.onclick = () => toggleStar(st.id);

        row.appendChild(info);
        row.appendChild(btn);
        list.appendChild(row);
      });

      summary.textContent = `${doneCount} من ${students.length} أنجزوا`;
    }

    async function toggleStar(studentId) {
      const student = students.find((s) => s.id === studentId);
      if (!student) return;

      const nextState = !student.completed;
      student.completed = nextState;
      renderStudents();

      if (hasSupabase && nextState) {
        await sb.from("stars").insert([
          {
            student_id: studentId,
            task_title: currentTask,
            points: 1
          }
        ]);
      }
    }

    async function addStudent() {
      const input = document.getElementById("newStudentInput");
      const name = input.value.trim();
      if (!name) return;

      if (hasSupabase) {
        const { data, error } = await sb
          .from("students_public")
          .insert([{ student_name: name }])
          .select()
          .single();

        if (!error && data) {
          students.push({ id: data.id, student_name: data.student_name, completed: false });
          input.value = "";
          renderStudents();
          return;
        }
      }

      students.push({
        id: String(Date.now()),
        student_name: name,
        completed: false
      });
      input.value = "";
      renderStudents();
    }

    async function init() {
      document.getElementById("currentTaskText").textContent = currentTask;

      if (hasSupabase) {
        const { data: pubStudents } = await sb
          .from("students_public")
          .select("id, student_name")
          .order("created_at", { ascending: true });

        if (pubStudents && pubStudents.length > 0) {
          students = pubStudents.map((s) => ({
            id: s.id,
            student_name: s.student_name,
            completed: false
          }));
        }
        document.getElementById("modeNote").textContent =
          "متصل بـ Supabase — عند ضغط الطالب على النجمة يُسجّل إنجازه تلقائيًا.";
      }

      renderStudents();
    }

    init();
  </script>
</body>
</html>
